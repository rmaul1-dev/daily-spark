<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Spark</title>
<meta name="description" content="A few minutes a day of bite-sized learning for the whole family.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Spark">
<meta name="theme-color" content="#fff7ec">
<meta name="referrer" content="no-referrer">
<meta name="app-version" content="daily-spark-v7-bdf94c0e">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#fff7ec;--card:#fffdf9;--ink:#2a1f17;--muted:#7b6a5b;--accent:#ef6a1a;--accent-d:#c9520c;--sun:#ffb547;--ok:#19864a;--ok-bg:#e5f6ea;--bad:#c23b3b;--bad-bg:#fdeaea;--line:#efdfcb;--r:22px;--tc:#ef6a1a;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
a{color:var(--accent-d)}
textarea,input,select{font:inherit;color:inherit}
#app{min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;width:100%;max-width:780px;margin:0 auto;padding:calc(14px + var(--sat)) calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal))}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.75rem;letter-spacing:-.01em}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.center{text-align:center}
.stack>*+*{margin-top:14px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:44px}
.top h1,.top h2{flex:1;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.25rem;background:#fff;border:1.5px solid var(--line);flex:none}
.iconbtn:active{transform:scale(.94)}
.iconbtn.on{background:#ffe3d1;border-color:#f6b48a}
.iconbtn[disabled]{opacity:.3}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--sun),var(--accent));display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 3px 10px #ef6a1a40}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:1.05rem;box-shadow:0 3px 0 var(--accent-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:0 16px;font-size:.95rem}
.btn[disabled]{opacity:.45;box-shadow:none}
button.link{color:var(--accent-d);font-weight:600;padding:8px 4px}

/* panels */
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 2px 0 #00000008}
.family{background:linear-gradient(160deg,#fff4e2,#ffe7d2);border-color:#f6cfa8;position:relative;overflow:hidden}
.family .tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d)}
.family .big{font-size:2.6rem;line-height:1}
.dinner{margin-top:12px;background:#ffffffc0;border-radius:16px;padding:12px 14px;font-size:.98rem}
.dinner b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:.85rem;font-weight:600;white-space:nowrap}
.chip.t{border-color:color-mix(in srgb,var(--tc) 35%,white);color:color-mix(in srgb,var(--tc) 85%,black);background:color-mix(in srgb,var(--tc) 9%,white)}
.chip.ok{background:var(--ok-bg);border-color:#bfe5cb;color:var(--ok)}

/* profiles */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.person{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:var(--r);background:#fff;border:1.5px solid var(--line);min-height:84px}
.person:active{transform:scale(.98)}
.avatar{width:54px;height:54px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:#fff1e0;border:2px solid #f8d2ad}
.person .nm{font-weight:800;font-size:1.12rem}
.person .meta{font-size:.86rem;color:var(--muted)}
.fire{font-weight:800;color:var(--accent-d)}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffd9bf;z-index:0}
.hold.holding .fill{width:100%;transition:width 1.1s linear}
.hold span{position:relative;z-index:1}

/* learner home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:1.35rem}
.stat span{font-size:.8rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:var(--r);background:#fff;border:1.5px solid var(--line);min-height:96px}
.tile .e{font-size:1.8rem;line-height:1}
.tile b{font-size:1.05rem}
.review{background:#eef6ff;border-color:#c7defa}

/* topics */
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.topics{grid-template-columns:repeat(4,1fr)}}
.topic{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:16px 14px 14px;border-radius:var(--r);background:#fff;border:1.5px solid var(--line);border-top:6px solid var(--tc);min-height:132px}
.topic .e{font-size:2.1rem;line-height:1}
.topic b{font-size:1.02rem;line-height:1.2}
.bar{width:100%;height:8px;border-radius:99px;background:#f3e8db;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--tc);border-radius:99px}
.packs{display:flex;flex-direction:column;gap:12px}
.packrow{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:var(--r);background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--tc)}
.packrow .e{font-size:2rem;flex:none}
.packrow b{display:block;font-size:1.05rem}
.packrow .s{font-size:.9rem;color:var(--muted)}

/* player */
.player{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:780px;margin:0 auto;width:100%;padding:calc(8px + var(--sat)) calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal))}
.ptop{display:flex;align-items:center;gap:8px;padding:4px 2px 10px}
.dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:#e9d9c6}
.dots i.on{background:var(--accent);transform:scale(1.25)}
.dots i.seen{background:#f5b58b}
.stage{flex:1;position:relative;min-height:0;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--card);border-radius:28px;border:1.5px solid var(--line);box-shadow:0 8px 24px #7a4a1a1a;display:flex;flex-direction:column;overflow:hidden;will-change:transform}
.card .band{height:10px;background:var(--tc);flex:none}
.card .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 24px 26px;display:flex;flex-direction:column}
.card .kicker{font-size:.8rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:color-mix(in srgb,var(--tc) 80%,black);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2{font-size:1.55rem;margin-bottom:12px;letter-spacing:-.01em}
.card p{margin:0 0 12px}
.card .txt{font-size:1.14rem}
.lv-kid .card .txt{font-size:1.24rem;line-height:1.5}
.lv-adult .card .txt{font-size:1.1rem}
.card .emoji{font-size:3.4rem;line-height:1;margin:2px 0 14px}
.card.hook .emoji{font-size:4.6rem;margin:10px 0 18px}
.card.hook h2{font-size:1.85rem}
.card.hook .body{justify-content:center}
.example{background:color-mix(in srgb,var(--tc) 8%,white);border-left:5px solid var(--tc);border-radius:14px;padding:12px 14px;font-size:1.02rem;margin-top:4px}
.example b{display:block;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fig{margin:14px auto 4px;width:100%;max-width:440px}
.fig svg{width:100%;height:auto;display:block}
.vmeta{color:var(--muted);font-weight:700;font-size:.95rem;margin:-4px 0 10px}
.card .vwhy{margin-bottom:14px}
.vbox{position:relative;width:100%;max-width:640px;margin:0 auto;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#1d1611;flex:none}
.vthumb{display:block;width:100%;height:100%;padding:0;border:0;background:#1d1611;cursor:pointer;position:relative}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vplay{position:absolute;left:50%;top:50%;width:78px;height:56px;margin:-28px 0 0 -39px;border-radius:16px;background:var(--accent);color:#fff;font-size:1.7rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0006}
.vthumb:active .vplay{transform:scale(.95)}
.vframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.voff{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:#fff7ec;font-weight:700;font-size:1.05rem;line-height:1.4;background:#3a2c22}
.vtoggle{margin-left:auto;white-space:nowrap}
.vtoggle[aria-pressed=false]{opacity:.75}
.hint{margin-top:auto;padding-top:16px;color:var(--muted);font-size:.9rem;text-align:center}
.nudges{list-style:none;padding:0;margin:6px 0 0}
.nudges li{background:#fff4e6;border-radius:14px;padding:10px 14px;margin-top:8px;font-size:1.02rem}
.nudges li::before{content:"💭 "}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{text-align:left;padding:14px 16px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:1.06rem;min-height:54px}
.opt:active{transform:scale(.99)}
.opt.right{border-color:#7fcf9c;background:var(--ok-bg)}
.opt.wrong{border-color:#eba3a3;background:var(--bad-bg)}
.opt.dim{opacity:.55}
.opt .why{display:block;font-size:.93rem;margin-top:6px;color:#3f342b}
.verdict{font-weight:800;margin-top:12px;font-size:1.05rem}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.starters button{padding:8px 12px;border-radius:999px;background:#fff4e6;border:1.5px solid #f6d3b0;font-size:.95rem}
textarea.note{width:100%;min-height:120px;border-radius:16px;border:2px solid var(--line);padding:12px 14px;background:#fff;resize:vertical;font-size:1.05rem}
textarea.note:focus{outline:none;border-color:#f6b48a}
.saved{font-size:.85rem;color:var(--ok);min-height:1.2em;margin-top:6px}
.src{padding:12px 0;border-top:1.5px dashed var(--line)}
.src:first-of-type{border-top:0}
.src a{font-weight:700;font-size:1.04rem;word-break:break-word}
.src .pub{font-size:.85rem;color:var(--muted);margin-top:2px}
.src .sup{font-size:.95rem;margin-top:6px}
.pnav{display:flex;gap:10px;padding-top:12px}
.pnav .btn{flex:1}
.pnav .btn.ghost{flex:0 0 32%}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:#2a1f17;color:#fff;padding:10px 18px;border-radius:999px;font-size:.95rem;z-index:50;max-width:90vw;text-align:center;animation:fade 2.2s forwards}
@keyframes fade{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.sheet-bg{position:fixed;inset:0;background:#2a1f1766;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:80vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 22px calc(24px + var(--sab))}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:26px}}

/* completion */
.done-hero{font-size:4.5rem;line-height:1;margin:18px 0 8px}
.score{font-size:1.2rem;font-weight:700}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.item .t{font-weight:700}
.note-q{margin-top:8px;padding:10px 12px;background:#fff6ea;border-radius:12px;font-size:.95rem;white-space:pre-wrap}
.note-q::before{content:"🗣️ ";}
.fav-card{border-left:6px solid var(--tc)}

/* parent */
.kid{margin-top:16px}
.kid .head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:520px){.kgrid{grid-template-columns:repeat(2,1fr)}}
.tbars{display:grid;grid-template-columns:1fr;gap:6px;margin:6px 0 12px}
@media(min-width:620px){.tbars{grid-template-columns:1fr 1fr;column-gap:18px}}
.tb{display:grid;grid-template-columns:24px 1fr 44px;align-items:center;gap:8px;font-size:.88rem}
.tb .bar{margin:0}
details{margin-top:6px}
summary{cursor:pointer;font-weight:700;padding:8px 0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input,.field select,textarea.code{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;font-size:1rem;min-height:46px}
textarea.code{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:.78rem}
.prof-edit{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1.3rem}
.emoji-pick button.sel{border-color:var(--accent);background:#ffe3d1}
.offline{display:inline-block;background:#fff3c4;border:1.5px solid #f0d77b;color:#6b5400;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
/* iPad and larger: bigger type, roomier cards */
@media(min-width:700px){
  html,body{font-size:19px}
  .player{padding-left:calc(28px + var(--sal));padding-right:calc(28px + var(--sar))}
  .player{justify-content:center}
  .stage{max-height:900px;flex:1 1 auto}
  .ptop,.stage,.pnav{width:100%}
  .card .body{padding:40px 48px 40px}
  .card h2{font-size:2.05rem}
  .card .txt{font-size:1.32rem}
  .lv-kid .card .txt{font-size:1.4rem}
  .lv-adult .card .txt{font-size:1.28rem}
  .card .emoji{font-size:4.6rem}
  .card.hook .emoji{font-size:6rem}
  .card.hook h2{font-size:2.5rem}
  .example{font-size:1.15rem;padding:16px 20px}
  .opt{font-size:1.2rem;padding:18px 20px}
  .nudges li{font-size:1.15rem}
  .fig{max-width:520px}
  .pnav{max-width:780px;margin:0 auto;width:100%}
}

/* ---------- v2 ---------- */
.btn.big{min-height:60px;font-size:1.15rem}
.week{padding:14px 16px}
.wdots{display:flex;gap:6px;margin:10px 0 8px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.wd i{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;background:#f3e8db;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#fff;font-size:.95rem}
.wd.on i{background:var(--ok)}
.wd.today i{box-shadow:0 0 0 3px #f6b48a}
.wd.fut i{background:#faf3ea;border:1.5px dashed #ead9c4}
.wd small{font-size:.72rem;color:var(--muted);font-weight:700}
.challenge{background:linear-gradient(160deg,#f1f8ff,#e6f1ff);border-color:#c7defa}
.challenge .tag,.family .tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#2b5d99}
.family .tag{color:var(--accent-d)}
.ask{width:100%;background:#fff7d6;border-color:#f0d77b;gap:12px}
.reveal{background:#f3efff;border:1.5px solid #d8cdfb;border-radius:16px;padding:12px 14px;margin:2px 0 12px;font-size:1.02rem}
.reveal>b{display:block;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:#5b44b8;margin-bottom:4px}
.gline{margin-bottom:6px}
.whybox{margin-top:12px;background:#fff8e8;border:1.5px dashed #f0cf93;border-radius:16px;padding:12px 14px;font-size:1.02rem}
.answer{margin-top:10px;background:var(--ok-bg);border:1.5px solid #bfe5cb;border-radius:14px;padding:10px 14px;font-size:1.04rem}
.answer b{display:block;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);margin-bottom:2px}
.est{margin-top:10px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px}
.estv{font-size:1.8rem;font-weight:800;text-align:center;margin-bottom:8px;color:var(--accent-d)}
.est input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
.opt.picked{border-color:var(--accent);background:#fff1e6;box-shadow:inset 0 0 0 1px var(--accent)}
.conf{margin-top:14px;background:#fff4e6;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-weight:700}
.conf .btn{flex:1}
.wrapq{margin-top:12px;padding:12px 14px;background:#fff;border:1.5px solid var(--line);border-radius:16px}
.rubric-got{background:var(--ok-bg);border-radius:16px;padding:12px 14px;margin:6px 0 14px;display:flex;flex-direction:column;gap:4px}
.rubric-got b{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.check{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:1.02rem;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ichip{padding:8px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:.95rem;min-height:40px}
.ichip.on{background:#ffe3d1;border-color:var(--accent);font-weight:700}
.sheet input{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;font-size:1rem;min-height:46px;width:100%}
.sheet textarea.note{min-height:70px}
.sheet .check input{width:24px;height:24px;min-height:0;padding:0;flex:none}
.grades{display:flex;flex-wrap:wrap;gap:8px}
.grades .btn{flex:1 1 auto;min-width:88px}
.note-q.mine::before{content:"✍️ "}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.band-c{border-radius:16px;padding:10px 6px;text-align:center;border:1.5px solid var(--line);background:#fff}
.band-c b{display:block;font-size:1.25rem}
.band-c span{font-size:.8rem;color:var(--muted)}
.b-new{--bc:#9bbf5a}.b-growing{--bc:#3fa564}.b-strong{--bc:#1f7a46}.b-refresh{--bc:#e08a2e}
.band-c{border-top:5px solid var(--bc)}
.ktopic h3{margin-bottom:8px}
.kseries{margin:6px 0 10px;padding-left:10px;border-left:3px solid color-mix(in srgb,var(--tc) 40%,white)}
.kpack{margin-top:8px}
.kph{font-weight:700;font-size:.95rem;margin-bottom:6px}
.kchips{display:flex;flex-direction:column;gap:6px}
.kchip{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--bc) 12%,white);border:1.5px solid color-mix(in srgb,var(--bc) 45%,white);font-size:.92rem;min-height:44px;width:100%}
.kchip .kt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.series{border-left:6px solid var(--tc)}
.spath{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:0}
.spath li{position:relative}
.spath li+li::before{content:"";position:absolute;left:21px;top:-10px;height:14px;border-left:3px dotted color-mix(in srgb,var(--tc) 50%,white)}
.spath button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:6px 0}
.spath .n{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff;border:2.5px solid var(--tc);color:color-mix(in srgb,var(--tc) 85%,black)}
.spath li.done .n{background:var(--tc);color:#fff}
.spath .st{display:flex;flex-direction:column;min-width:0}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toggles .vtoggle{margin-left:0}
.warnp{background:var(--bad-bg);border-color:#eba3a3}
.card.warm .body{justify-content:flex-start}
.prof-edit .chips .ichip{font-size:.9rem}
@media(max-width:420px){.bands b{font-size:1.1rem}.kgrid .stat b{font-size:1.1rem}}
@media(min-width:700px){
  .reveal,.whybox,.answer{font-size:1.15rem;padding:16px 20px}
  .estv{font-size:2.3rem}
  .kchips{display:grid;grid-template-columns:1fr 1fr}
}
/* v2 fixes: long decks keep their progress dots on one line; the 4 adult grades fit in one row */
.dots{flex-wrap:nowrap;gap:4px;min-width:0}

.grades .btn{padding-left:6px;padding-right:6px;white-space:nowrap}
.week .row{flex-wrap:wrap;row-gap:4px}

</head>
<body>
<div id="app"></div>
<script>
/* Daily Spark engine: pure logic (no DOM), shared by the app and the node tests.
   Dates are local calendar days as 'YYYY-MM-DD' keys. */
(function (root) {
  'use strict';
  const LEVELS = ['adult', 'teen', 'kid'];
  const STREAK_SECONDS = 300;                   // 5 minutes of learning (or one finished pack or warm-up) counts a day

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, '0');
  function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dayNum(key) { const [y, m, d] = key.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); }
  function fromNum(n) { const d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function addDays(key, n) { return fromNum(dayNum(key) + n); }

  // ---------- content ----------
  const CARD_TYPES = ['hook', 'predict', 'idea', 'link', 'think', 'quiz', 'teach'];
  function checkPack(p) {
    // light runtime check (the full validator is tools/validate.js); returns a list of problems
    const errs = [];
    if (!p || typeof p !== 'object') return ['not an object'];
    ['id', 'topic', 'level', 'title'].forEach(k => { if (!p[k] || typeof p[k] !== 'string') errs.push('missing ' + k); });
    if (LEVELS.indexOf(p.level) < 0) errs.push('bad level ' + p.level);
    if (!Array.isArray(p.cards) || !p.cards.length) errs.push('no cards');
    else {
      p.cards.forEach((c, i) => { if (CARD_TYPES.indexOf(c && c.type) < 0) errs.push('card ' + i + ' has bad type'); });
      const quiz = p.cards.find(c => c.type === 'quiz');
      if (!quiz || !Array.isArray(quiz.questions) || !quiz.questions.length) errs.push('no quiz');
      else quiz.questions.forEach((q, i) => {
        if (!Array.isArray(q.options) || q.options.filter(o => o.correct).length !== 1) errs.push('question ' + i + ' needs exactly one correct option');
      });
    }
    if (!Array.isArray(p.sources) || !p.sources.length) errs.push('no sources');
    return errs;
  }

  // ---------- learning video (optional, stored at pack level so older app versions ignore it) ----------
  const VIDEO_ID = /^[A-Za-z0-9_-]{11}$/;
  const VIDEO_HOST = 'https://www.youtube-nocookie.com';
  const isInt = n => typeof n === 'number' && Number.isInteger(n) && n >= 0;
  function checkVideo(v) {
    const errs = [];
    if (!v || typeof v !== 'object') return ['video is not an object'];
    if (typeof v.youtube_id !== 'string' || !VIDEO_ID.test(v.youtube_id)) errs.push('video.youtube_id must be an 11-character YouTube id');
    ['title', 'channel', 'why'].forEach(k => { if (typeof v[k] !== 'string' || !v[k].trim()) errs.push('video.' + k + ' missing'); });
    if (!isInt(v.duration_sec) || v.duration_sec < 1) errs.push('video.duration_sec must be a positive whole number');
    if (v.start != null && !isInt(v.start)) errs.push('video.start must be whole seconds');
    if (v.end != null && !isInt(v.end)) errs.push('video.end must be whole seconds');
    if (isInt(v.end) && v.end <= (v.start || 0)) errs.push('video.end must be after video.start');
    if (isInt(v.end) && isInt(v.duration_sec) && v.end > v.duration_sec) errs.push('video.end is past the end of the video');
    if (isInt(v.start) && isInt(v.duration_sec) && v.start >= v.duration_sec) errs.push('video.start is past the end of the video');
    return errs;
  }
  // seconds the learner will actually watch (the clip, if start/end are set)
  function videoSeconds(v) { return Math.max(0, (v.end != null ? v.end : v.duration_sec) - (v.start || 0)); }
  function fmtDuration(sec) { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + pad(sec % 60); }
  function embedUrl(v, autoplay) {
    let u = VIDEO_HOST + '/embed/' + v.youtube_id + '?playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&fs=1';
    if (v.start) u += '&start=' + v.start;
    if (v.end) u += '&end=' + v.end;
    if (autoplay) u += '&autoplay=1';
    return u;
  }
  // A predict card is usable if it has a question and either choices or an estimate range
  function okPredict(c) {
    if (!c || typeof c.question !== 'string' || !c.question.trim() || typeof c.reveal !== 'string') return false;
    if (c.mode === 'estimate') { const e = c.estimate; return !!e && [e.min, e.max, e.step, e.answer].every(n => typeof n === 'number' && isFinite(n)) && e.max > e.min && e.step > 0; }
    return Array.isArray(c.options) && c.options.length >= 2 && c.options.every(o => o && typeof o.text === 'string');
  }
  // The card sequence the player shows. Quiz cards expand into one card per question. opts:
  //   videos: false        -> no Watch card (grown-ups setting)
  //   done: {packId: ...}  -> link cards appear only if the learner finished the pack they link to
  //   seriesRecall: {...}  -> a "last time in this series" recall card before the hook
  //   seriesWrap: [...]    -> a cumulative series check before the teach card (final part of a series)
  // A Watch card goes right after the last idea card when the pack has a valid video. A malformed optional card
  // (predict/link) is skipped rather than breaking the pack, so a learner can always finish.
  function deck(pack, opts) {
    opts = opts || {};
    const cards = [];
    const pred = pack.cards.find(c => c.type === 'predict');
    const predOk = okPredict(pred);
    const nIdeas = pack.cards.filter(c => c.type === 'idea').length;
    const revealAt = predOk ? Math.max(1, Math.min(nIdeas, pred.reveal_after | 0 || nIdeas)) : 0;
    let ideaNo = 0;
    if (opts.seriesRecall) cards.push(Object.assign({ type: 'srecall' }, opts.seriesRecall));
    pack.cards.forEach((c, ci) => {
      if (c.type === 'quiz') c.questions.forEach((q, j) => cards.push({ type: 'q', q, j, n: c.questions.length, ci }));
      else if (c.type === 'predict') { if (predOk && c === pred) cards.push(Object.assign({ ci }, c)); }
      else if (c.type === 'link') { if (c.to && c.prompt && opts.done && opts.done[c.to]) cards.push(Object.assign({ ci }, c)); }
      else if (c.type === 'idea') { ideaNo++; cards.push(Object.assign({ ci, n: ideaNo }, c, ideaNo === revealAt ? { reveal: pred } : {})); }
      else if (c.type === 'teach' && opts.seriesWrap && opts.seriesWrap.length) { cards.push({ type: 'swrap', items: opts.seriesWrap, series: opts.seriesTitle }); cards.push(Object.assign({ ci }, c)); }
      else cards.push(Object.assign({ ci }, c));
    });
    const wantVideo = opts.videos !== false && pack.video && !checkVideo(pack.video).length;
    if (wantVideo) {
      let at = -1; cards.forEach((c, i) => { if (c.type === 'idea') at = i + 1; });
      if (at < 0) at = cards.findIndex(c => c.type === 'think' || c.type === 'q' || c.type === 'teach');
      if (at < 0) at = cards.length;
      cards.splice(at, 0, { type: 'watch', video: pack.video });
    }
    cards.push({ type: 'sources' });
    return cards;
  }

  // fetchJson(url) -> Promise<object>; memo is an optional {id: pack} cache (e.g. packs kept from earlier loads)
  async function loadPack(fetchJson, id, memo) {
    if (memo && memo[id]) return memo[id];
    if (!/^[a-z0-9-]+$/.test(id)) throw new Error('bad pack id ' + id);
    const p = await fetchJson('content/packs/' + id + '.json');
    const errs = checkPack(p);
    if (errs.length) throw new Error('pack ' + id + ': ' + errs.join('; '));
    if (p.id !== id) throw new Error('pack id mismatch: ' + p.id + ' vs ' + id);
    if (memo) memo[id] = p;
    return p;
  }

  // index: {topics:[{id,name,emoji,color}], packs:[{id,topic,level,title,...}], family:[{date,topic,title,packs:{adult,teen,kid},dinner_question}]}
  async function loadIndex(fetchJson, fallback) {
    try {
      const idx = await fetchJson('content/index.json');
      if (!idx || !Array.isArray(idx.packs)) throw new Error('index has no packs');
      return { index: idx, fresh: true };
    } catch (e) {
      if (fallback && Array.isArray(fallback.packs)) return { index: fallback, fresh: false };
      throw e;
    }
  }

  function packsFor(index, level, topic) {
    return index.packs.filter(p => p.level === level && (!topic || p.topic === topic))
      .sort((a, b) => (a.date_added || '').localeCompare(b.date_added || '') || a.id.localeCompare(b.id));
  }

  // Family topic of the day: an exact date entry wins; otherwise rotate through the dated list in order.
  function familyFor(index, key) {
    const fam = (index.family || []).filter(f => f && f.date && f.packs).slice().sort((a, b) => a.date.localeCompare(b.date));
    if (!fam.length) return null;
    const exact = fam.find(f => f.date === key);
    if (exact) return Object.assign({ rotated: false }, exact);
    const n = fam.length, off = dayNum(key) - dayNum(fam[0].date);
    const i = ((off % n) + n) % n;
    return Object.assign({}, fam[i], { rotated: true });
  }

  // ---------- learner data ----------
  // Data version 2 (Daily Spark v2). v1 data is migrated on load by migrate(); see the migration tests.
  const DATA_VERSION = 2;
  function newLearner() {
    return { done: {}, history: [], days: {}, memory: {}, favs: {}, teach: {}, quiz: { asked: 0, correct: 0 },
      predict: {}, calib: { sureRight: 0, sureWrong: 0, unsureRight: 0, unsureWrong: 0 }, recall: { w1: [0, 0], w5: [0, 0] },
      dinner: {}, weekGoals: {}, dv: DATA_VERSION };
  }
  function day(L, key) { return L.days[key] || (L.days[key] = { sec: 0, packs: 0 }); }
  function addSeconds(L, key, sec) { if (sec > 0) day(L, key).sec += Math.round(sec); }
  // a day "counts" with one finished pack, one finished warm-up, or 5 minutes of learning
  function dayCounts(d) { return !!d && (d.packs >= 1 || d.warm >= 1 || d.sec >= STREAK_SECONDS); }

  // v1 daily streak, kept only as history ("longest run of days"); v2 headlines weekly goals instead
  function streak(L, key) {
    let k = dayCounts(L.days[key]) ? key : addDays(key, -1), n = 0;
    while (dayCounts(L.days[k])) { n++; k = addDays(k, -1); }
    return n;
  }
  function bestStreak(L) {
    const keys = Object.keys(L.days || {}).filter(k => DATE.test(k) && dayCounts(L.days[k])).sort();
    let best = 0, run = 0, prev = null;
    keys.forEach(k => { run = prev && dayNum(k) - dayNum(prev) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = k; });
    return best;
  }

  // ---------- memory: spaced recall of key ideas and missed / unsure quiz questions ----------
  const LADDER = [1, 3, 7, 16, 35, 75, 150];      // days; box 0..6. Items are never retired.
  const CAP = { kid: 3, teen: 4, adult: 5 };       // warm-up size
  const MORE_MAX = 15;                             // most recall items in one day, warm-up + "More review"
  const GRADES = ['again', 'partly', 'good', 'easy'];   // shown as Not yet / Partly / Got it / Easy (Easy: adults only)
  const DATE = /^\d{4}-\d{2}-\d{2}$/;
  const clampBox = b => Math.max(0, Math.min(6, b | 0));
  // deterministic 0..1 from a string (FNV-1a), so jitter is testable
  function hash01(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
  // ±10% of the interval (for intervals of 7+ days) to spread reviews out; seeded by item id + rep count
  function jitter(id, interval, salt) {
    if (interval < 7) return 0;
    const f = hash01(String(id) + '|' + (salt || 0)) * 0.2 - 0.1;
    return Math.round(interval * f);
  }
  function memId(packId, sub) { return packId + '#' + sub; }
  function qid(packId, qi) { return packId + '#' + qi; }
  const cleanOpts = o => Array.isArray(o) ? o.filter(x => x && typeof x.text === 'string').map(x => { const r = { text: x.text }; if (x.correct) r.correct = true; if (x.why) r.why = x.why; return r; }) : undefined;

  // Seed a pack's key ideas into memory when the learner finishes it. Existing items are left alone (finishing a
  // pack again doesn't reset progress). spread > 0 staggers first reviews (used when backfilling old packs).
  function seedKeys(L, pack, key, spread) {
    let added = 0;
    (Array.isArray(pack.keys) ? pack.keys : []).forEach((k, i) => {
      if (!k || !k.id || !k.prompt) return;
      const id = memId(pack.id, k.id);
      if (L.memory[id]) return;
      const first = 1 + (spread ? (i + added + (spread - 1)) % 7 : 0);
      L.memory[id] = { id, kind: 'key', packId: pack.id, topic: pack.topic, series: pack.series ? pack.series.id : undefined, title: pack.title,
        prompt: k.prompt, answer: k.answer, options: cleanOpts(k.options), box: 0, iv: 1, due: addDays(key, first), reps: 0, lapses: 0, last: null, added: key, hist: '' };
      added++;
    });
    return added;
  }
  // refresh a slimmed item's text from its pack (see compact())
  function fillFromPack(it, pack) {
    if (!it || !pack) return it;
    if (it.kind === 'key') {
      const k = (pack.keys || []).find(x => memId(pack.id, x.id) === it.id);
      if (k) return Object.assign({}, it, { prompt: k.prompt, answer: k.answer, options: cleanOpts(k.options) });
    }
    return it;
  }
  const hasText = it => !!(it && it.prompt);

  // One quiz answer inside a pack. Misses come back tomorrow; right-but-"Not sure" comes back in 3 days.
  // item: {id, packId, topic, title, q, options}; conf: 'sure' | 'unsure' | null
  function recordAnswer(L, key, item, correct, conf, chosenText) {
    L.quiz.asked++; if (correct) L.quiz.correct++;
    if (conf === 'sure' || conf === 'unsure') L.calib[conf + (correct ? 'Right' : 'Wrong')]++;
    const m = L.memory[item.id];
    if (!correct) {
      if (m) { m.lapses = (m.lapses || 0) + 1; m.box = 0; m.iv = 1; m.due = addDays(key, 1); m.hist = ((m.hist || '') + 'a').slice(-3); }
      else L.memory[item.id] = { id: item.id, kind: 'quiz', packId: item.packId, topic: item.topic, title: item.title, prompt: item.q, options: cleanOpts(item.options),
        box: 0, iv: 1, due: addDays(key, 1), reps: 0, lapses: 1, last: null, added: key, hist: '' };
      if (chosenText) L.memory[item.id].lastWrong = String(chosenText).slice(0, 200);
      if (conf) L.memory[item.id].conf = conf;
      return 'again';
    }
    if (conf === 'unsure' && !m) {
      L.memory[item.id] = { id: item.id, kind: 'quiz', packId: item.packId, topic: item.topic, title: item.title, prompt: item.q, options: cleanOpts(item.options),
        box: 1, iv: 3, due: addDays(key, 3), reps: 0, lapses: 0, last: null, added: key, hist: '', conf };
      return 'unsure';
    }
    return null;
  }
  // a link (connection) card the learner thought about comes back in 3 days
  function addLink(L, key, pack, card) {
    const id = memId(pack.id, 'link-' + card.to);
    if (L.memory[id]) return false;
    L.memory[id] = { id, kind: 'link', packId: pack.id, topic: pack.topic, title: pack.title, prompt: card.prompt, answer: card.model,
      box: 1, iv: 3, due: addDays(key, 3), reps: 0, lapses: 0, last: null, added: key, hist: '' };
    return true;
  }

  // Grade one recall. g: 'again' (Not yet) | 'partly' | 'good' (Got it) | 'easy'.
  //   Not yet: lapses++, box -= 2 (min 0), due tomorrow     Partly: same box, due in half the box interval
  //   Got it:  box + 1, due in LADDER[box]                    Easy:   box + 2, due in LADDER[box]
  //   Intervals of 7+ days get ±10% jitter. Returns the item.
  function grade(L, key, id, g) {
    const it = L.memory[id]; if (!it) return null;
    if (GRADES.indexOf(g) < 0) throw new Error('bad grade ' + g);
    const before = clampBox(it.box), wasIv = it.iv || LADDER[before];
    let box = before, iv;
    if (g === 'again') { it.lapses = (it.lapses || 0) + 1; box = Math.max(0, before - 2); iv = 1; }
    else if (g === 'partly') iv = Math.ceil(LADDER[before] / 2);
    else if (g === 'good') { box = Math.min(6, before + 1); iv = LADDER[box]; }
    else { box = Math.min(6, before + 2); iv = LADDER[box]; }
    it.reps = (it.reps || 0) + 1;
    // delayed-recall metric: key ideas recalled after a 1-week and a 5-week gap
    if (it.kind === 'key' && L.recall) {
      const b = wasIv === 7 ? 'w1' : wasIv === 35 ? 'w5' : null;
      if (b) { L.recall[b][0]++; if (g === 'good' || g === 'easy') L.recall[b][1]++; }
    }
    it.box = box; it.iv = iv; it.due = addDays(key, Math.max(1, iv + jitter(it.id, iv, it.reps))); it.last = key;
    it.hist = ((it.hist || '') + g[0]).slice(-3);
    const d = day(L, key); d.rev = (d.rev || 0) + 1;
    return it;
  }
  function reviewsToday(L, key) { return ((L.days[key] || {}).rev) || 0; }

  // how overdue an item is, relative to its interval (warm-up picks the most overdue first)
  function overdueRatio(it, key) { return (dayNum(key) - dayNum(it.due)) / (it.iv || LADDER[clampBox(it.box)]); }
  function dueItems(L, key) {
    return Object.values(L.memory || {}).filter(it => it && DATE.test(it.due || '') && it.due <= key && it.last !== key);
  }
  // never two in a row from the same pack; prefer switching topics
  function interleave(items) {
    const out = [], pool = items.slice();
    while (pool.length) {
      const last = out[out.length - 1];
      let i = last ? pool.findIndex(x => x.packId !== last.packId && x.topic !== last.topic) : 0;
      if (i < 0) i = pool.findIndex(x => x.packId !== last.packId);
      if (i < 0) break;
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  }
  // Warm-up: up to CAP[level] items. specials (a parent's question, the dinner follow-up) go first, then due items by
  // overdue ratio, interleaved across packs. boostPack (yesterday's family pack) is pulled to the front of the recall
  // items. Already-reviewed-today items are skipped. The caller never shows how many more are waiting.
  function warmup(L, key, level, opts) {
    opts = opts || {};
    const cap = opts.cap || CAP[level] || 4, skip = opts.exclude || new Set();
    const room = Math.max(0, MORE_MAX - reviewsToday(L, key));
    const boost = it => (opts.boostPack && it.packId === opts.boostPack ? 1 : 0);
    const due = dueItems(L, key).filter(it => !skip.has(it.id))
      .sort((a, b) => boost(b) - boost(a) || overdueRatio(b, key) - overdueRatio(a, key) || a.id.localeCompare(b.id));
    const specials = (opts.specials || []).slice(0, 2);
    return specials.concat(interleave(due).slice(0, room)).slice(0, cap);
  }
  // A parent's / listener's question back, waiting for the learner's answer (oldest first)
  function pendingQuestions(L) {
    return Object.entries(L.teach || {}).filter(([, t]) => t && t.parent && t.parent.reply && !t.parent.answered)
      .sort((a, b) => (a[1].parent.date || '').localeCompare(b[1].parent.date || ''))
      .map(([packId, t]) => ({ id: 'pq:' + packId, kind: 'parentq', packId, topic: t.topic, title: t.title, prompt: t.parent.reply, by: t.parent.by || '' }));
  }
  function answerQuestion(L, key, packId, text) {
    const t = L.teach[packId]; if (!t || !t.parent) return false;
    t.parent.answered = { text: String(text || '').slice(0, 1000), date: key }; return true;
  }
  // The morning after a family day: did this learner do yesterday's family pack (or was dinner logged)?
  // famY: the family entry for yesterday; dinners: ST.family.dinners
  function dinnerFollowup(L, key, level, famY, dinners) {
    if (!famY || !famY.packs) return null;
    const y = addDays(key, -1), pid = famY.packs[level];
    if (L.dinner && L.dinner[y]) return null;
    const did = (L.history || []).some(h => h.packId === pid && h.date === y);
    const held = dinners && dinners[y] && dinners[y].held;
    if (!did && !held) return null;
    return { id: 'dinner:' + y, kind: 'dinner', date: y, packId: did ? pid : null, topic: famY.topic, title: famY.title, question: famY.dinner_question };
  }

  // ---------- "What I know": strength bands for key ideas ----------
  function strength(it, key) {
    if (!it.reps) return 'new';
    const over = dayNum(key) - dayNum(it.due), recentMisses = (it.hist || '').split('').filter(c => c === 'a').length;

    if (!EDIT) EDIT = JSON.parse(JSON.stringify(ST.profiles));
    return '<div class="screen"><div class="top"><button class="iconbtn" data-act="cancelprof">←</button><h1>Profiles</h1></div><div class="list">' +
      EDIT.map((p, i) => '<div class="item prof-edit"><div class="avatar">' + esc(p.avatar) + '</div><div style="min-width:0"><div class="field"><label class="small muted">Name</label><input maxlength="24" data-pi="' + i + '" data-f="name" value="' + esc(p.name) + '"></div>' +
        '<div class="field"><label class="small muted">Level</label><select data-pi="' + i + '" data-f="level">' + DS.LEVELS.map(l => '<option value="' + l + '"' + (p.level === l ? ' selected' : '') + '>' + LEVEL_NAME[l] + (l === 'kid' ? ' (about ages 9–12)' : l === 'teen' ? ' (about 12–16)' : '') + '</option>').join('') + '</select></div>' +
        '<div class="field"><label class="small muted">Weekly goal: days a week</label><div class="chips">' + [3, 4, 5, 6].map(g => '<button class="ichip' + ((p.weeklyGoal || DS.GOAL_DEFAULT[p.level]) === g ? ' on' : '') + '" data-act="goal" data-arg="' + i + ':' + g + '">' + g + ' days</button>').join('') + '</div></div>' +
        '<div class="field"><label class="small muted">Interests: some examples get flavored to these</label><div class="chips">' + DS.INTERESTS.map(([id, e, n]) => '<button class="ichip' + ((p.interests || []).includes(id) ? ' on' : '') + '" data-act="interest" data-arg="' + i + ':' + id + '">' + e + ' ' + n + '</button>').join('') + '</div></div>' +
        '<label class="check"><input type="checkbox" data-pi="' + i + '" data-f="conf"' + (p.conf === false ? '' : ' checked') + '> Ask “How sure?” after quiz answers</label>' +
        '<div class="emoji-pick" style="margin-top:10px">' + AVATARS.map(a => '<button data-act="avatar" data-arg="' + i + ':' + a + '" class="' + (a === p.avatar ? 'sel' : '') + '">' + a + '</button>').join('') + '</div>' +
        (EDIT.length > 1 ? '<button class="link" data-act="delprof" data-arg="' + i + '">Remove</button>' : '') + '</div></div>').join('') + '</div>' +
      '<div class="row" style="margin-top:16px;flex-wrap:wrap">' + (EDIT.length < 6 ? '<button class="btn ghost sm" data-act="addprof">+ Add learner</button>' : '') + '<span class="spacer"></span><button class="btn" data-act="saveprof">Save</button></div></div>';
  };
  AFTER.profiles = function () {
    $app.querySelectorAll('[data-pi]').forEach(el => el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', () => {
      const p = EDIT[+el.dataset.pi];
      if (el.dataset.f === 'conf') { if (el.checked) delete p.conf; else p.conf = false; }
      else p[el.dataset.f] = el.value;
    }));
  };

  // ---------- actions ----------
  const ACT = Object.assign({
    go: a => go(a),
    noop: () => { },
    pick: id => { ST.current = id; save(); go('home'); },
    topic: id => go('topic', id),
    open: (id, el) => openPack(id, el && el.dataset.fam),
    today: () => { const p = prof(), tp = todaysPack(p), doneToday = (learner(p.id).days[today()] || {}).packs > 0; startWarmup(tp && !doneToday ? tp : null); },
    next: () => step(1), prev: () => step(-1),
    answer,
    conf: arg => { const [j, c] = arg.split(':'); if (P.pending[+j] != null) commitAnswer(+j, P.pending[+j], c); },
    guess: k => { const c = P.cards[P.i]; setGuess({ text: c.options[+k].text }); render(); },
    why: ci => { P.why[ci] = 1; render(); into('.whybox .answer'); },
    show: key => {
      P.shown[key] = true;
      const c = P.cards[P.i];
      if (c.type === 'link' && DS.addLink(learner(ST.current), today(), P.pack, c)) save();
      render();
      if (c.type === 'swrap') requestAnimationFrame(() => { const w = document.querySelectorAll('.wrapq')[Number(key.slice(1))]; if (w) w.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
      else into('.card .answer');
    },
    teachmode: m => { P.teachMode = m; render(); },
    listener: () => listenerSheet(P.pack.id, ST.current, false),
    reply: arg => { const [pid, owner] = arg.split('|'); listenerSheet(pid, owner, true); },
    rbsave: (arg, el) => saveListener(arg, el),
    close: () => { P = null; go('home'); },
    finish,
    playvideo: () => playVideo(),
    vidtoggle: id => { const p = ST.profiles.find(x => x.id === id); if (!p) return; if (videosOn(p)) p.videos = false; else delete p.videos; save(); toast('Videos ' + (videosOn(p) ? 'on' : 'off') + ' for ' + p.name); render(); },
    conftoggle: id => { const p = ST.profiles.find(x => x.id === id); if (!p) return; if (confOn(p)) p.conf = false; else delete p.conf; save(); toast('“How sure?” ' + (confOn(p) ? 'on' : 'off') + ' for ' + p.name); render(); },
    chaltoggle: () => { ST.family.challengeOn = !ST.family.challengeOn; save(); render(); },
    chal: () => { const wk = DS.isoWeek(today()), c = ST.family.challenge[wk] || (ST.family.challenge[wk] = {}); if (c[ST.current]) delete c[ST.current]; else { c[ST.current] = today(); toast('Nice teamwork! 🤝'); } save(); render(); },
    kopen: id => openKey(id),
    fav: () => {
      const c = P.cards[P.i], L = learner(ST.current), id = P.pack.id + ':' + c.ci;
      if (L.favs[id]) delete L.favs[id];
      else { L.favs[id] = { id, packId: P.pack.id, packTitle: P.pack.title, topic: P.pack.topic, emoji: c.emoji, title: c.title, text: c.text, example: c.example || '', date: today() }; toast('Saved ♥'); }
      save(); render();
    },
    unfav: id => { delete learner(ST.current).favs[id]; save(); render(); },
    sources: () => sheet('<h2>🔎 How do we know?</h2><p class="muted small">' + esc(P.pack.title) + '</p>' + sourcesHtml(P.pack)),
    closesheet: (a, el) => el.closest('.sheet-bg').remove(),
    starter: s => { const ta = document.getElementById('teachNote'); if (!ta) return; ta.value = (ta.value.trim() ? ta.value.trim() + ' ' : '') + s.replace(/…$/, '') + ' '; ta.focus(); ta.dispatchEvent(new Event('input')); },
    export: exportCode, import: importCode,
    avatar: a => { const [i, e] = a.split(':'); EDIT[+i].avatar = e; render(); },
    goal: a => { const [i, g] = a.split(':'); EDIT[+i].weeklyGoal = +g; render(); },
    interest: a => { const [i, id] = a.split(':'), p = EDIT[+i], s = new Set(p.interests || []); if (s.has(id)) s.delete(id); else if (s.size < 8) s.add(id); p.interests = [...s]; render(); },
    addprof: () => { EDIT.push({ id: 'p' + Date.now().toString(36), name: 'New learner', level: 'kid', avatar: AVATARS[EDIT.length % AVATARS.length], interests: [], weeklyGoal: DS.GOAL_DEFAULT.kid }); render(); },
    delprof: i => { const p = EDIT[+i]; if (confirm('Remove ' + p.name + '? Their progress on this device will be deleted.')) { EDIT.splice(+i, 1); render(); } },
    cancelprof: () => { EDIT = null; go('who'); },
    saveprof: () => {
      EDIT.forEach(p => { p.name = (p.name || '').trim().slice(0, 24) || 'Learner'; });
      const keep = new Set(EDIT.map(p => p.id));
      Object.keys(ST.learners).forEach(id => { if (!keep.has(id)) delete ST.learners[id]; });
      ST.profiles = EDIT; EDIT = null; if (!keep.has(ST.current)) ST.current = null;
      DS.migrate(ST, today()); save(); prefetch(); go('who');
    },
  }, WACT);
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset.arg, el, e); }
  });
  document.addEventListener('keydown', e => {
    if (S.name !== 'player' || e.target.closest('textarea,input')) return;
    if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1);
  });

  // ---------- start ----------
  async function start() {
    $app.innerHTML = '<div class="screen center"><div class="done-hero">✨</div><p class="muted">Loading…</p></div>';
    await loadContent();
    render();
    if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
    backfillKeys();
    setTimeout(prefetch, 800);
  }
  window.DSAPP = { go, openPack, startWarmup, step, state: () => ST, player: () => P, warm: () => W, index: () => INDEX, save, render, ACT, backfillKeys, reload: () => { ST = load(); render(); } };
  start();
})();

</script>
</body>
</html>
